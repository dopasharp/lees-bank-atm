<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LEE&#39;S BANK">
<meta name="theme-color" content="#eef1f5">
<title>LEE&#39;S BANK ATM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #eef1f5;
    --screen: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --soft: #f5f7fa;
    --blue: #2563eb;
    --blue-soft: #eaf1ff;
    --red: #dc2626;
    --green: #16a34a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
    overflow: hidden; letter-spacing: -0.01em;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .machine {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 40px) calc(env(safe-area-inset-right) + 56px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 56px);
  }
  .screen-frame {
    flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--screen); border-radius: 24px;
    box-shadow: 0 1px 2px rgba(17,24,39,.04), 0 12px 32px rgba(17,24,39,.06);
  }
  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 48px; border-bottom: 1px solid var(--line);
  }
  .bank { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .bank .logo {
    width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 16px;
  }
  .clock { font-variant-numeric: tabular-nums; font-size: 16px; color: var(--muted); font-weight: 500; }
  main { flex: 1; min-height: 0; position: relative; }
  .view {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 64px; text-align: center;
  }
  .view.on { display: flex; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h1 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 700; margin: 0 0 10px; letter-spacing: -0.03em; }
  .sub { font-size: clamp(15px, 1.7vw, 19px); color: var(--muted); margin: 0 0 36px; line-height: 1.5; }
  .sub b { color: var(--ink); font-weight: 600; }

  /* 처음 화면 메뉴 */
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: min(820px, 100%); }
  .menu button, .amounts button {
    font: inherit; color: var(--ink); cursor: pointer; position: relative;
    background: var(--screen); border: 1.5px solid var(--line); border-radius: 20px;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .menu button {
    display: flex; align-items: center; gap: 20px; text-align: left;
    padding: 28px; min-height: 128px;
  }
  .menu button:hover, .amounts button:hover { border-color: #c7d2fe; }
  .menu button:active, .menu button.press, .amounts button:active, .amounts button.press {
    border-color: var(--blue); background: var(--blue-soft); transform: scale(.985);
  }
  .menu .ico {
    width: 60px; height: 60px; flex: none; border-radius: 16px;
    background: var(--blue-soft); color: var(--blue); display: grid; place-items: center;
  }
  .menu .ico svg { width: 30px; height: 30px; }
  .menu .t { font-size: clamp(21px, 2.4vw, 26px); font-weight: 700; }
  .menu .d { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .key {
    position: absolute; top: 14px; right: 16px;
    font-size: 13px; font-weight: 600; color: #9ca3af; font-variant-numeric: tabular-nums;
  }
  .hint { margin-top: 32px; font-size: 14px; color: #9ca3af; }
  .hint kbd {
    font: inherit; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; background: var(--soft);
  }

  /* 비밀번호 */
  .pin-box { display: flex; gap: 22px; margin: 4px 0 24px; }
  .pin-box span {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #d1d5db; transition: background .12s, border-color .12s, transform .12s;
    font-size: 0;
  }
  .pin-box span.filled { background: var(--blue); border-color: var(--blue); transform: scale(1.08); }
  .pin-box span.cur { border-color: var(--blue); }
  .pin-box.err span { border-color: var(--red); }
  .pin-box.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .msg { min-height: 24px; font-size: 16px; font-weight: 600; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }

  /* 카드 투입 */
  .card-anim { position: relative; width: 240px; height: 190px; margin-bottom: 18px; overflow: hidden; }
  .card-slot { position: absolute; left: 20px; right: 20px; bottom: 0; height: 22px; border-radius: 11px; background: #d1d5db; z-index: 2; }
  .card {
    position: absolute; left: 50%; bottom: 11px; width: 120px; height: 172px; margin-left: -60px;
    border-radius: 12px; background: linear-gradient(160deg, #3b82f6, var(--blue));
    animation: insert 2s ease-in-out infinite;
  }
  .card i { position: absolute; top: 22px; left: 18px; width: 30px; height: 24px; border-radius: 5px; background: #fcd34d; }
  @keyframes insert {
    0%, 15% { transform: translateY(-14px); opacity: 0; }
    30% { transform: translateY(-14px); opacity: 1; }
    80% { transform: translateY(120px); opacity: 1; }
    100% { transform: translateY(120px); opacity: 0; }
  }

  /* 숫자 입력 */
  .field {
    width: min(480px, 90%); min-height: 72px;
    border-bottom: 2px solid var(--blue); padding: 8px 4px;
    font-size: clamp(30px, 3.8vw, 42px); font-weight: 700; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px;
  }
  .field .ph { color: #d1d5db; font-weight: 600; }
  .field .caret { width: 2px; height: .9em; background: var(--blue); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 금액 */
  .amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: min(820px, 100%); }
  .amounts button { min-height: 92px; font-size: clamp(19px, 2.2vw, 24px); font-weight: 700; }
  .amounts .key { top: 10px; left: 14px; right: auto; }
  .amounts button.all { grid-column: 1 / -1; min-height: 76px; gap: 12px; border-color: #c7d2fe; background: var(--blue-soft); color: var(--blue); display: flex; align-items: center; justify-content: center; }
  .amounts button.all:active, .amounts button.all.press { background: #dbe6ff; border-color: var(--blue); }
  .amounts button.all:disabled { opacity: .4; cursor: default; }
  .all-amt { font-size: .8em; font-weight: 600; opacity: .8; }

  .actions { display: flex; gap: 12px; margin-top: 28px; }
  .act {
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 14px; padding: 15px 0; width: 150px;
    background: var(--soft); color: var(--ink);
  }
  .act.go { background: var(--blue); color: #fff; }
  .act:active { filter: brightness(.95); }

  .receipt {
    width: min(460px, 90%); text-align: left;
    background: var(--soft); border-radius: 18px; padding: 8px 24px;
  }
  .receipt .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
    padding: 14px 0; font-size: 16px; color: var(--muted); border-bottom: 1px solid var(--line);
  }
  .receipt .row:last-child { border: 0; }
  .receipt .row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .receipt .big { font-size: 24px; font-weight: 700 !important; }

  .spinner {
    width: 52px; height: 52px; border-radius: 50%; margin-bottom: 28px;
    border: 4px solid var(--blue-soft); border-top-color: var(--blue);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 현금 나옴 */
  .slot-wrap { position: relative; width: 360px; max-width: 80%; height: 170px; margin-bottom: 20px; overflow: hidden; }
  .slot { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; border-radius: 11px; background: #d1d5db; }
  .bill {
    position: absolute; left: 50%; bottom: 11px; width: 260px; height: 124px; margin-left: -130px;
    border-radius: 10px; background: #f6d77a; border: 1.5px solid #e2b84a;
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    font-size: 22px; font-weight: 800; color: #8a6514;
    transform: translateY(140px);
  }
  .bill::after { content: ""; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.5); }
  .view.on .bill { animation: out .9s cubic-bezier(.2,.8,.3,1) forwards; }
  .view.on .bill:nth-child(2) { animation-delay: .2s; }
  .view.on .bill:nth-child(3) { animation-delay: .4s; }
  .bill:nth-child(1) { --y: 0px; }
  .bill:nth-child(2) { --y: -8px; --r: -2deg; }
  .bill:nth-child(3) { --y: -16px; --r: 2deg; }
  @keyframes out { to { transform: translateY(var(--y)) rotate(var(--r, 0deg)); } }

  .badge {
    width: 76px; height: 76px; border-radius: 50%; margin-bottom: 22px;
    display: grid; place-items: center; background: var(--blue-soft); color: var(--blue);
  }
  .badge svg { width: 36px; height: 36px; }
  .badge.red { background: #fdecec; color: var(--red); }
  .count { margin-top: 22px; color: #9ca3af; font-size: 14px; }

  footer.bar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 48px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); min-height: 64px;
  }
  .nav { display: flex; gap: 10px; flex: none; }
  .nb {
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--screen); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 22px; min-width: 112px; justify-content: center;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  .nb svg { width: 18px; height: 18px; }
  .nb:active { background: var(--soft); }
  .nb.go { background: var(--blue); border-color: var(--blue); color: #fff; }
  .nb.go:active { filter: brightness(.92); }
  .nb:disabled { opacity: .35; cursor: default; }
  .amounts button.picked { border-color: var(--blue); }

  #cap { position: fixed; left: -9999px; top: 0; opacity: 0; width: 1px; height: 1px; }

  @media (max-width: 700px) {
    .machine { padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px); }
    .menu, .amounts { grid-template-columns: 1fr; }
    .menu button { min-height: 88px; padding: 18px; }
    header.bar, footer.bar { padding-left: 16px; padding-right: 16px; }
    #foot-msg { display: none; }
    .nav { flex: 1; } .nb { flex: 1; min-width: 0; padding: 12px 8px; }
    .view { padding: 16px; }
  }
  @media (max-height: 640px) {
    .menu button { min-height: 84px; padding: 16px 22px; }
    .sub { margin-bottom: 18px; }
  }
</style>
</head>
<body>
<div class="machine">
  <div class="screen-frame">
    <header class="bar">
      <div class="bank"><div class="logo">L</div>LEE&#39;S BANK</div>
      <div class="clock" id="clock"></div>
    </header>

    <main>
      <!-- 처음 화면 -->
      <section class="view on" id="v-home">
        <h1>원하시는 거래를 선택하세요</h1>
        <p class="sub">화면을 누르거나 키보드 숫자를 누르세요</p>
        <div class="menu">
          <button data-go="withdraw"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/></svg></span><span><div class="t">현금 인출</div><div class="d">돈을 찾아요</div></span><span class="key">1</span></button>
          <button data-go="transfer"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg></span><span><div class="t">송금 · 이체</div><div class="d">다른 계좌로 보내요</div></span><span class="key">2</span></button>
          <button data-go="balance"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><span><div class="t">잔액 조회</div><div class="d">남은 돈을 확인해요</div></span><span class="key">3</span></button>
          <button data-go="deposit"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 9.5 12 14l4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span><span><div class="t">입금</div><div class="d">돈을 넣어요</div></span><span class="key">4</span></button>
        </div>
      </section>

      <!-- 비밀번호 -->
      <section class="view" id="v-pin">
        <h1>비밀번호를 입력하세요</h1>
        <p class="sub" id="pin-sub">비밀번호 6자리를 입력하세요</p>
        <div class="pin-box" id="pin-box"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="hint"><kbd>⌫</kbd> 지우기 · <kbd>Enter</kbd> 다음</div>
      </section>

      <!-- 카드 투입 -->
      <section class="view" id="v-card">
        <div class="card-anim"><div class="card-slot"></div><div class="card"><i></i></div></div>
        <h1>카드를 투입하세요</h1>
        <p class="sub">카드를 넣으면 인출이 시작됩니다</p>
        <div class="hint">카드를 넣은 뒤 <b>다음</b>을 누르세요</div>
      </section>

      <!-- 금액 선택 -->
      <section class="view" id="v-amount">
        <h1 id="amount-title"></h1>
        <p class="sub" id="amount-sub"></p>
        <div class="amounts" id="amounts"></div>
      </section>

      <!-- 숫자 직접 입력 (금액 / 계좌번호) -->
      <section class="view" id="v-input">
        <h1 id="input-title"></h1>
        <p class="sub" id="input-sub"></p>
        <div class="field" id="input-field"></div>
        <div class="hint"><kbd>⌫</kbd> 지우기 · <kbd>Enter</kbd> 다음</div>
      </section>

      <!-- 확인 -->
      <section class="view" id="v-confirm">
        <h1>거래 내용을 확인하세요</h1>
        <p class="sub">맞으면 <b>다음</b>을 누르세요</p>
        <div class="receipt" id="confirm-rows"></div>
      </section>

      <!-- 처리 중 -->
      <section class="view" id="v-wait">
        <div class="spinner"></div>
        <h1 id="wait-title">처리 중입니다</h1>
        <p class="sub">잠시만 기다려 주세요</p>
      </section>

      <!-- 현금 나옴 -->
      <section class="view" id="v-cash">
        <div class="slot-wrap">
          <div class="bill">50,000</div><div class="bill">50,000</div><div class="bill">50,000</div>
          <div class="slot"></div>
        </div>
        <h1>현금을 받으세요</h1>
        <p class="sub" id="cash-sub"></p>
      </section>

      <!-- 결과 -->
      <section class="view" id="v-done">
        <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        <h1 id="done-title"></h1>
        <div class="receipt" id="done-rows"></div>
      </section>
    </main>

    <footer class="bar">
      <span id="foot-msg"></span>
      <nav class="nav">
        <button class="nb" id="b-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>이전</button>
        <button class="nb" id="b-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>홈으로</button>
        <button class="nb go" id="b-next">다음<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </nav>
    </footer>
  </div>
</div>

<input id="cap" type="text" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true">

<script>
(() => {
  const IDLE_MS = 60000;
  const PIN_LEN = 6;
  const SAMPLE_ACCOUNT = '1102345678901';
  const PRESETS = [10000, 30000, 50000, 100000, 300000];
  const LABEL = { withdraw: '현금 인출', transfer: '송금 · 이체', balance: '잔액 조회', deposit: '입금' };

  const state = { mode: null, balance: 1000000, amount: 0, account: '', pin: '', input: '' };
  let stack = [];          // 지나온 화면들 (이전 버튼용)
  let nextFn = null;       // 지금 화면에서 "다음"을 눌렀을 때 할 일
  let inputCfg = null, pick = 0, view = 'home', timers = [], idle;

  const $ = (s) => document.querySelector(s);
  const won = (n) => n.toLocaleString('ko-KR') + '원';
  const fmtAcct = (v) => v.replace(/^(\d{3})(\d{3})(\d+)$/, '$1-$2-$3');

  // ---- 소리 ----
  let ac;
  function beep(f = 880, d = 0.07, type = 'square', vol = 0.06) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch (e) {}
  }
  const errBeep = () => { beep(220, .18, 'sawtooth'); setTimeout(() => beep(180, .25, 'sawtooth'), 200); };
  const okBeep = () => { beep(988, .08); setTimeout(() => beep(1319, .12), 90); };

  // ---- 화면 / 이동 ----
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function show(name, next, foot) {
    timers.forEach(clearTimeout); timers = [];
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + name));
    view = name; nextFn = next;
    $('#foot-msg').textContent = foot || (state.mode ? LABEL[state.mode] : '');
    $('#b-prev').disabled = name === 'home';
    $('#b-home').disabled = name === 'home';
    focusCap(); resetIdle();
  }
  // 화면 하나 = 다시 그릴 수 있는 함수. go로 쌓고, 이전은 하나 빼고 다시 그림
  function go(step) { stack.push(step); step(); }
  function prev() {
    if (view === 'wait') { stack[stack.length - 1](); return; }   // 처리 중이면 그 전 화면으로
    if (stack.length > 1) stack.pop();
    stack[stack.length - 1]();
  }
  function home() {
    Object.assign(state, { mode: null, amount: 0, account: '', pin: '', input: '' });
    stack = []; go(homeStep);
  }
  function next() { if (nextFn) nextFn(); }
  // 결과 화면: 이전을 누르면 처음 화면 (같은 거래가 두 번 되지 않게)
  function result(step) { stack = [homeStep]; go(step); }
  // 처리 중 화면: 잠깐 보여주고 자동으로 넘어감 (다음을 누르면 바로)
  function wait(title, then) {
    $('#wait-title').textContent = title;
    show('wait', then);
    later(then, 1600);
  }

  // ---- 처음 화면 ----
  function homeStep() { show('home', () => choose('withdraw'), '원하시는 거래를 선택하세요'); }
  function choose(mode) { beep(); state.mode = mode; go(pinStep); }

  // ---- 비밀번호: 아무거나 넣어도(안 넣어도) 다음으로 ----
  function pinStep() {
    state.pin = '';
    $('#pin-sub').innerHTML = `<b>${LABEL[state.mode]}</b> · 비밀번호 6자리를 입력하세요`;
    drawPin();
    show('pin', () => { okBeep(); afterPin(); }, '비밀번호는 다른 사람이 보지 않게 입력하세요');
  }
  function drawPin() {
    [...$('#pin-box').children].forEach((s, i) => {
      s.classList.toggle('filled', i < state.pin.length);
      s.classList.toggle('cur', i === state.pin.length);
    });
  }
  function afterPin() {
    const m = state.mode;
    if (m === 'withdraw') go(cardStep);            // 카드 투입은 현금 인출에서만
    else if (m === 'transfer') go(accountStep);
    else if (m === 'deposit') go(amountStep);
    else if (m === 'balance') wait('조회 중입니다', () => result(balanceStep));
  }

  // ---- 카드 투입 ----
  function cardStep() {
    show('card', () => { beep(); wait('카드를 읽고 있습니다', () => go(amountStep)); }, '카드를 IC칩이 위로 오게 넣어 주세요');
  }

  // ---- 숫자 입력 (계좌번호 / 직접 입력 금액) ----
  function inputStep(cfg) {
    inputCfg = cfg; state.input = '';
    $('#input-title').textContent = cfg.title;
    $('#input-sub').textContent = cfg.sub;
    drawInput();
    show('input', () => { beep(); cfg.ok(state.input); });
  }
  function drawInput() {
    const v = state.input;
    $('#input-field').innerHTML = (v ? `<span>${inputCfg.fmt(v)}</span>` : `<span class="ph">${inputCfg.ph}</span>`) + '<span class="caret"></span>';
  }
  function accountStep() {
    inputStep({
      title: '받는 분 계좌번호를 입력하세요', sub: '숫자만 입력하세요', ph: '계좌번호', max: 14,
      fmt: (v) => v,
      ok: (v) => { state.account = v || SAMPLE_ACCOUNT; go(amountStep); },
    });
  }
  function customAmountStep() {
    inputStep({
      title: '금액을 입력하세요', sub: '원 단위로 입력하세요', ph: '금액', max: 8,
      fmt: (v) => Number(v).toLocaleString('ko-KR') + ' 원',
      ok: (v) => chooseAmount(Number(v) || PRESETS[0]),
    });
  }

  // ---- 금액 선택 ----
  const AMOUNT_TITLE = { withdraw: '인출할 금액을 선택하세요', transfer: '보낼 금액을 선택하세요', deposit: '입금할 금액을 선택하세요' };
  function amountStep() {
    const m = state.mode, hasAll = m !== 'deposit';
    const all = m === 'withdraw' ? Math.floor(state.balance / 10000) * 10000 : state.balance;
    $('#amount-title').textContent = AMOUNT_TITLE[m];
    $('#amount-sub').textContent = `잔액 ${won(state.balance)}`;
    const box = $('#amounts'); box.innerHTML = '';
    const opts = PRESETS.map(a => [(a / 10000) + '만원', () => chooseAmount(a)]);
    opts.push(['직접 입력', () => go(customAmountStep)]);
    if (hasAll) opts.push([`전액 <span class="all-amt">${won(all)}</span>`, () => chooseAmount(all), 'all']);
    pick = 0;
    opts.forEach(([text, fn, cls], i) => {
      const b = document.createElement('button');
      b.innerHTML = `<span class="key">${i + 1}</span>${text}`;
      b.dataset.k = i + 1;
      if (cls) b.classList.add(cls);
      b.onclick = () => { beep(); fn(); };
      box.appendChild(b);
    });
    markPick();
    // 아무것도 안 고르고 다음 → 표시된 금액(처음엔 1만원)
    show('amount', () => box.children[pick].click());
  }
  function markPick() { [...$('#amounts').children].forEach((b, i) => b.classList.toggle('picked', i === pick)); }
  function chooseAmount(a) {
    if (state.mode !== 'deposit' && a > state.balance) {
      errBeep();
      $('#amount-sub').innerHTML = `<span style="color:var(--red);font-weight:600">잔액이 부족합니다 (잔액 ${won(state.balance)})</span>`;
      if (view !== 'amount') prev();
      return;
    }
    state.amount = a;
    go(confirmStep);
  }

  // ---- 확인 ----
  function rowsHtml(rows) {
    return rows.map(([k, v, big]) => `<div class="row"><span>${k}</span><b class="${big ? 'big' : ''}">${v}</b></div>`).join('');
  }
  function confirmStep() {
    const m = state.mode, rows = [['거래', LABEL[m]], ['금액', won(state.amount), true]];
    if (m === 'transfer') rows.splice(1, 0, ['받는 계좌', fmtAcct(state.account)]);
    if (m !== 'deposit') rows.push(['수수료', '0원']);
    $('#confirm-rows').innerHTML = rowsHtml(rows);
    show('confirm', () => { beep(); commit(); });
  }

  // ---- 처리 / 결과 ----
  function commit() {
    const { mode: m, amount: a } = state;
    if (m === 'withdraw') wait('현금을 세고 있습니다', () => { state.balance -= a; result(cashStep); });
    else if (m === 'transfer') wait('송금 중입니다', () => {
      state.balance -= a;
      result(doneStep('송금이 완료되었습니다', [['받는 계좌', fmtAcct(state.account)], ['보낸 금액', won(a), true], ['남은 잔액', won(state.balance)]]));
    });
    else if (m === 'deposit') wait('현금을 확인하고 있습니다', () => {
      state.balance += a;
      result(doneStep('입금이 완료되었습니다', [['입금액', won(a), true], ['잔액', won(state.balance)]]));
    });
  }
  function cashStep() {
    $('#cash-sub').textContent = `${won(state.amount)} · 남은 잔액 ${won(state.balance)}`;
    show('cash', home, '현금과 카드를 꼭 챙기세요');
    for (let i = 0; i < 6; i++) later(() => beep(140 + (i % 2) * 40, .09, 'square', .05), 300 + i * 110);
    later(okBeep, 1300);
  }
  function balanceStep() {
    doneStep('잔액 조회', [['계좌', "LEE'S BANK 123-456-789012"], ['현재 잔액', won(state.balance), true]])();
  }
  function doneStep(title, rows) {
    return () => {
      $('#done-title').textContent = title;
      $('#done-rows').innerHTML = rowsHtml(rows);
      okBeep();
      show('done', home, '이용해 주셔서 감사합니다');
    };
  }

  // ---- 키보드 ----
  function onKey(key) {
    resetIdle();
    const digit = /^[0-9]$/.test(key) ? key : null;
    const back = key === 'Backspace' || key === 'Delete';
    if (key === 'Escape') { if (view !== 'home') { beep(440); home(); } return; }
    if (key === 'Enter' || key === 'ArrowRight') { next(); return; }
    if (key === 'ArrowLeft') { if (view !== 'home') { beep(660); prev(); } return; }

    if (view === 'home') {
      const b = digit && document.querySelectorAll('#v-home .menu button')[Number(digit) - 1];
      if (b) press(b);
    } else if (view === 'pin') {
      if (digit && state.pin.length < PIN_LEN) { state.pin += digit; beep(); drawPin(); }
      else if (back && state.pin) { state.pin = state.pin.slice(0, -1); beep(660); drawPin(); }
    } else if (view === 'amount') {
      const b = digit && $(`#amounts button[data-k="${digit}"]`);
      if (b) press(b);
    } else if (view === 'input') {
      if (digit && state.input.length < inputCfg.max && !(digit === '0' && !state.input && inputCfg.ph === '금액')) {
        state.input += digit; beep(); drawInput();
      } else if (back && state.input) { state.input = state.input.slice(0, -1); beep(660); drawInput(); }
    }
  }
  function press(b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 120); b.click(); }

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['Enter', 'Escape', 'Backspace', 'Delete', ' ', 'ArrowLeft', 'ArrowRight'].includes(e.key) || /^[0-9]$/.test(e.key)) e.preventDefault();
    onKey(e.key);
  });

  // 아이패드에서 하드웨어 키보드 입력을 놓치지 않도록 보이지 않는 입력칸에 포커스 유지
  const cap = $('#cap');
  function focusCap() { try { cap.focus({ preventScroll: true }); } catch (e) {} }
  cap.addEventListener('input', () => { cap.value = ''; });
  document.addEventListener('pointerdown', () => setTimeout(focusCap, 0));

  // ---- 버튼 ----
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => choose(b.dataset.go)));
  $('#b-next').addEventListener('click', () => { beep(); next(); });
  $('#b-prev').addEventListener('click', () => { beep(660); prev(); });
  $('#b-home').addEventListener('click', () => { beep(440); home(); });

  // ---- 시계 / 자동 복귀 ----
  function clock() {
    const d = new Date();
    $('#clock').textContent = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + ' ' +
      d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  clock(); setInterval(clock, 10000);
  function resetIdle() { clearTimeout(idle); idle = setTimeout(() => { if (view !== 'home') home(); }, IDLE_MS); }

  home();
})();
</script>
</body>
</html>
